<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>せどりCSVカード</title>
  <link rel="stylesheet" href="style.css?v=20260923-3">
</head>
<body>
  <header>
    <h1>せどりCSVカード</h1>
    <label class="picker" for="csv-files">CSVをまとめて選択</label>
    <input id="csv-files" type="file" multiple accept=".csv,text/csv">
    <p id="summary" aria-live="polite">CSVを選択してください</p>
    <div id="category-controls" hidden>
      <label for="procurement-filter">仕入れカテゴリー</label>
      <select id="procurement-filter" aria-label="仕入れカテゴリーで絞り込み">
        <option value="__ALL__">全カテゴリー</option>
      </select>
      <label for="category-filter">Amazonカテゴリー</label>
      <select id="category-filter" aria-label="Amazonカテゴリーで絞り込み">
        <option value="__ALL__">全カテゴリー</option>
      </select>
    </div>
    <div id="file-controls" hidden>
      <ul id="selected-files" aria-label="選択中のCSV"></ul>
      <button id="clear-all" type="button">全部取り消す</button>
    </div>
    <ul id="errors" class="errors" aria-live="assertive"></ul>
  </header>
  <main id="cards"></main>
  <script src="csv-core.js?v=20260923-3"></script>
  <script src="app.js?v=20260923-3"></script>
</body>
</html>
