<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>せどりCSVカード</title>
  <link rel="stylesheet" href="style.css?v=20260923-10">
</head>
<body>
  <header>
    <h1>せどりCSVカード</h1>
    <label class="picker" for="csv-files">CSVをまとめて選択</label>
    <input id="csv-files" type="file" multiple accept=".csv,text/csv">
    <p id="summary" aria-live="polite">CSVを選択してください</p>
    <select id="view-filter" hidden aria-label="全商品またはお気に入りを表示">
      <option value="all">全商品</option>
      <option value="favorites">★ お気に入り</option>
    </select>
    <div id="favorites-controls">
      <button id="favorites-toggle" type="button" aria-expanded="false" aria-controls="favorites-panel">
        <span>★ お気に入り</span>
        <span class="favorites-toggle-side"><span id="favorites-count">0件</span><span class="favorites-toggle-mark" aria-hidden="true">▼</span></span>
      </button>
      <div id="favorites-panel" hidden>
        <div class="favorites-main-actions">
          <button id="favorites-show-all" type="button">すべてのお気に入り</button>
          <button id="favorites-back-all" type="button">全商品に戻る</button>
        </div>
        <div class="favorites-genre-label">ジャンル</div>
        <div id="favorite-genres" aria-label="お気に入りジャンル"></div>
        <button id="favorites-export" type="button">お気に入り一括出力</button>
      </div>
    </div>
    <div id="category-controls" hidden>
      <label id="procurement-label" for="procurement-filter">仕入れカテゴリー</label>
      <select id="procurement-filter" aria-label="仕入れカテゴリーで絞り込み">
        <option value="__ALL__">全カテゴリー</option>
      </select>
      <label for="category-filter">Amazonカテゴリー</label>
      <select id="category-filter" aria-label="Amazonカテゴリーで絞り込み">
        <option value="__ALL__">全カテゴリー</option>
      </select>
      <label for="amazon-status-filter">Amazon本体</label>
      <select id="amazon-status-filter" aria-label="Amazon本体の在庫状態で絞り込み">
        <option value="__ALL__">すべて</option>
        <option value="absent">Amazon不在</option>
        <option value="present">Amazonあり</option>
        <option value="unknown">不明</option>
      </select>
    </div>
    <div id="file-controls" hidden>
      <button id="file-toggle" type="button" aria-expanded="false" aria-controls="file-panel">
        <span id="file-toggle-label">選択中CSV</span><span class="file-toggle-mark" aria-hidden="true">▼</span>
      </button>
      <div id="file-panel" hidden>
        <ul id="selected-files" aria-label="選択中のCSV"></ul>
        <button id="clear-all" type="button">全部取り消す</button>
      </div>
    </div>
    <ul id="errors" class="errors" aria-live="assertive"></ul>
  </header>
  <main id="cards"></main>
  <script src="csv-core.js?v=20260923-10"></script>
  <script src="app.js?v=20260923-10"></script>
</body>
</html>
